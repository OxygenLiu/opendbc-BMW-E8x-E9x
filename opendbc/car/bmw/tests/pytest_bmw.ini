[pytest]
# BMW Test Suite Configuration
# Comprehensive test configuration for BMW E8x/E9x integration validation
# Usage: pytest -c opendbc/car/bmw/tests/pytest_bmw.ini

# Test paths - BMW-specific and relevant tests from main suite
testpaths = 
    opendbc/car/bmw/tests/test_bmw.py
    opendbc/car/tests/test_car_interfaces.py::TestCarInterfaces::test_car_interfaces[BMW_E82]
    opendbc/car/tests/test_car_interfaces.py::TestCarInterfaces::test_car_interfaces[BMW_E90]
    opendbc/car/tests/test_fw_fingerprint.py
    opendbc/car/tests/test_lateral_limits.py
    opendbc/car/tests/test_platform_configs.py
    opendbc/car/tests/test_docs.py
    opendbc/car/tests/test_routes.py

# Note: CAN fingerprint tests expected to fail (BMW uses VIN-based detection)
# opendbc/car/tests/test_can_fingerprint.py::TestCanFingerprint::test_can_fingerprint[BMW_E82-fingerprints0]
# opendbc/car/tests/test_can_fingerprint.py::TestCanFingerprint::test_can_fingerprint[BMW_E90-fingerprints1]

# Filter for BMW-relevant tests when running broader test suites
addopts = -v -k "BMW or bmw"

# Test markers
markers =
    bmw: BMW-specific integration tests